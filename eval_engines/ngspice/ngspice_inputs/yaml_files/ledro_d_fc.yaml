database_dir: "Autockt/checkpoint/db/ledro_d_fc_ngspice"
dsn_netlist: "eval_engines/ngspice/ngspice_inputs/netlist/ledro_d_fc.cir"
num_process: 1

params:
  nB1:  !!python/tuple [1, 7, 7]
  nB2:  !!python/tuple [1, 7, 7]
  nB3:  !!python/tuple [1, 7, 7]
  nB4:  !!python/tuple [1, 7, 7]
  nB5:  !!python/tuple [1, 7, 7]
  nB6:  !!python/tuple [1, 7, 7]
  nA1:  !!python/tuple [!!float 10, !!float 900, 100]
  nA2:  !!python/tuple [!!float 10, !!float 900, 100]
  nA3:  !!python/tuple [!!float 10, !!float 900, 100]
  nA4:  !!python/tuple [!!float 10, !!float 900, 100]
  nA5:  !!python/tuple [!!float 10, !!float 900, 100]
  nA6:  !!python/tuple [!!float 10, !!float 900, 100]
  vbiasp1: !!python/tuple [!!float 1, !!float 8, 20]
  vbiasp2: !!python/tuple [!!float 1, !!float 8, 20]
  vbiasn0: !!python/tuple [!!float 1, !!float 8, 20]
  vbiasn1: !!python/tuple [!!float 1, !!float 8, 20]
  vbiasn2: !!python/tuple [!!float 1, !!float 8, 20]


#Every specification output will be normlaized in the order of (gain, ibias, pm, ugbw)
normalize: !!python/tuple [!!float 20.0e+6,3300,!!float 10e-6,70]

#during training, at reset a specification will be chosen at random between [min,max,#]
target_specs:
  gain_min: !!python/tuple [3300,6600]
  ugbw_min: !!python/tuple [!!float 2.0e+6, !!float 2.5e+7]
  phm_min: !!python/tuple [70,70.0000001]
  ibias_max: !!python/tuple [1e-6, 0.01]
